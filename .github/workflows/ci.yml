name: CI Pipeline

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]

# Prevent concurrent runs from conflicting
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  statuses: write

jobs:
  # Job 1: Lint and test (runs on every PR AND every master push).
  #
  # Running on master push surfaces drift the moment it lands instead of
  # letting it accumulate silently until the next PR pays the bill — that
  # exact accident produced 3 pre-existing E402 + 11 black-drift files we
  # had to clean up inside an unrelated feature branch in #42.
  lint-test:
    runs-on: ubuntu-latest
    # ruff + black + mypy + ~3100 pytest cases; 10 minutes started timing out in 2026-09.
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the PR head ref on pull_request, otherwise the pushed sha
          # (default).
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
          fetch-depth: 1

      - name: Pull latest changes
        if: github.event_name == 'pull_request'
        run: git pull origin ${{ github.head_ref }} || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        # Replaces `curl … | sh` with the official action, SHA-pinned to v8.1.0.
        # Removes the supply-chain risk of an attacker-controlled install script.
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.9.26"

      - name: Install dependencies
        timeout-minutes: 3
        run: uv sync --frozen --extra dev

      # Fail fast on multiple Alembic heads. This is what bit prod when
      # b8e2d1c47a90 and b1c2d3e4f5a6 both pointed at a3f7b8c9d0e1 —
      # deploy ran `flask db upgrade head` and Alembic refused with
      # "Multiple head revisions are present for given argument 'head'".
      # Pure-Python scan, no Flask/Alembic context required.
      - name: Check for multiple Alembic heads
        id: migration-heads
        timeout-minutes: 1
        run: python3 scripts/check_migration_heads.py

      - name: Run ruff
        id: ruff
        timeout-minutes: 2
        run: uv run ruff check . --output-format=full

      - name: Run black
        id: black
        timeout-minutes: 2
        run: uv run black --check . --color

      - name: Run mypy
        id: mypy
        timeout-minutes: 3
        continue-on-error: true  # Pre-existing typing debt; report only, do not fail build
        run: uv run mypy . --color-output

      - name: Run pytest
        id: pytest
        timeout-minutes: 20
        run: uv run pytest --tb=short -q --color=yes

      - name: Write job summary
        if: always()
        run: |
          echo "## Lint & Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| migration-heads | ${{ steps.migration-heads.outcome || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ruff | ${{ steps.ruff.outcome || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| black | ${{ steps.black.outcome || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| mypy | ${{ steps.mypy.outcome || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pytest | ${{ steps.pytest.outcome || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY

  # Job 2: Create the release (only on push to master — lint-test already passed on the PR).
  #
  # The version is computed HERE, at merge time, from the tag list. Computing it
  # per pull request meant two branches open across one master version both read
  # the same number and both claimed it; whichever merged second landed carrying
  # a version already released, and its tag, its GitHub release and its dispatch
  # to the parent were all skipped (#163 reached master and never reached
  # production that way). Tags are the atomic record — whatever this job reads
  # has already been pushed by every release before it — and the workflow's
  # `concurrency` group serialises master pushes, so two runs cannot interleave.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Widened over the workflow default (pull-requests: read): recording the version
    # goes through a pull request this job opens and merges itself.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GitHub CLI
        run: |
          # Add local bin to PATH for this step
          export PATH="$HOME/.local/bin:$PATH"

          if ! command -v gh &> /dev/null; then
            if [ "$(uname)" = "Darwin" ]; then
              brew install gh
            else
              # Linux: install to user directory (no sudo required)
              GH_VERSION=$(curl -s https://api.github.com/repos/cli/cli/releases/latest | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
              curl -sL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" | tar xz
              mkdir -p "$HOME/.local/bin"
              mv gh_${GH_VERSION}_linux_amd64/bin/gh "$HOME/.local/bin/"
              echo "$HOME/.local/bin" >> $GITHUB_PATH
              rm -rf gh_${GH_VERSION}_linux_amd64
            fi
          fi
          gh --version

      - name: Resolve the bump type from the merged pull request
        id: bump-type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          LABELS=$(gh api "repos/${{ github.repository }}/commits/$GITHUB_SHA/pulls" \
            --jq '.[].labels[].name' 2>/dev/null || echo "")
          echo "Labels on the merged PR: ${LABELS:-<none>}"

          # Explicit label wins; otherwise patch, so every merged PR releases.
          # `version:none` opts out — docs-only, ci-only, or a hotfix riding on
          # the previous release.
          if echo "$LABELS" | grep -q "version:none"; then
            TYPE=none
          elif echo "$LABELS" | grep -q "version:major"; then
            TYPE=major
          elif echo "$LABELS" | grep -q "version:minor"; then
            TYPE=minor
          else
            TYPE=patch
          fi
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "Bump type: $TYPE"

      - name: Compute the next version from the tag list
        id: get-version
        if: steps.bump-type.outputs.type != 'none'
        run: |
          # The highest released tag, not pyproject.toml: the file on this
          # commit is whatever the branch happened to carry, while the tags say
          # what has actually shipped.
          BASE=$(git tag -l 'v[0-9]*' | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          BASE=${BASE:-0.0.0}

          MAJOR=${BASE%%.*}; REST=${BASE#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
          case "${{ steps.bump-type.outputs.type }}" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "Highest released tag: v$BASE -> releasing v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve the commit to release
        id: record
        if: steps.bump-type.outputs.type != 'none'
        run: |
          # The version is deliberately NOT written back to pyproject.toml on master.
          # master is protected ("changes must be made through a pull request"), the
          # Actions identity cannot be added to the bypass list, and the flowitup
          # organisation forbids GitHub Actions from opening or approving pull
          # requests (HTTP 403 on 2026-09-11) — so no bot-driven commit can ever land
          # there and every merge stayed untagged and undeployed. The tag list is the
          # source of truth for what shipped (see "Compute the next version"), and the
          # image the parent builds is the merge commit itself. pyproject.toml only
          # feeds the OpenAPI `version` field and may lag behind the tag.
          echo "sha=$GITHUB_SHA" >> $GITHUB_OUTPUT

      - name: Create tag
        if: steps.bump-type.outputs.type != 'none'
        run: |
          TAG="${{ steps.get-version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "${{ steps.record.outputs.sha }}"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.bump-type.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          VERSION="${{ steps.get-version.outputs.version }}"
          TAG="${{ steps.get-version.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "## What's Changed

          Version $VERSION released.

          **Full Changelog**: https://github.com/${{ github.repository }}/commits/$TAG" \
            --latest

      - name: Write job summary
        if: steps.bump-type.outputs.type != 'none'
        run: |
          echo "## Release Created" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.get-version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY

      # Notify the parent (flowitup/folio) that a new version is ready to deploy.
      # Parent listens via repository_dispatch event_type=deploy-api in
      # .github/workflows/deploy-backend.yml.
      # Requires PARENT_DISPATCH_TOKEN: fine-grained PAT scoped to flowitup/folio
      # with Contents:read + Metadata:read + Actions:write.
      - name: Dispatch deploy to parent (folio)
        if: steps.bump-type.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ secrets.PARENT_DISPATCH_TOKEN }}
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          VERSION="${{ steps.get-version.outputs.version }}"
          SHA="${{ steps.record.outputs.sha }}"
          REF="${{ steps.get-version.outputs.tag }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Dispatching deploy-api to flowitup/folio (v$VERSION, sha $SHA)"
          # Build JSON via jq to guarantee string-typed payload fields and
          # safe shell-escaping. gh api exits non-zero on 4xx/5xx (set -e).
          jq -n \
            --arg version "$VERSION" \
            --arg sha     "$SHA" \
            --arg ref     "$REF" \
            --arg run_url "$RUN_URL" \
            '{event_type:"deploy-api", client_payload:{version:$version, sha:$sha, ref:$ref, run_url:$run_url}}' \
          | gh api -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/flowitup/folio/dispatches \
              --input -
          {
            echo "## Parent deploy dispatched"
            echo "- Event: \`deploy-api\`"
            echo "- Version: v$VERSION"
            echo "- SHA: \`$SHA\`"
            echo "- Parent runs: https://github.com/flowitup/folio/actions/workflows/deploy-backend.yml"
          } >> "$GITHUB_STEP_SUMMARY"
