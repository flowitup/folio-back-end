[project]
name = "construction-backend"
version = "0.2.141"
description = "Construction Management System - Backend API"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
    "flask-cors>=4.0.0",
    "rq>=1.16.0",
    "redis>=5.0.0",
    "gunicorn>=21.0.0",
    "sqlalchemy>=2.0.45",
    "flask-migrate>=4.1.0",
    "psycopg2-binary>=2.9.11",
    "alembic>=1.18.1",
    "flask-jwt-extended>=4.7.1",
    "flask-login>=0.6.3",
    "pydantic>=2.12.5",
    "flask-limiter>=3.5.0",
    "email-validator>=2.0.0",
    "apispec>=6.6",
    "flask-swagger-ui>=4.11.1",
    "boto3>=1.42.96",
    "openpyxl>=3.1",
    "reportlab>=4.4",
    "python-slugify>=8.0",
    "httpx>=0.27",
    "pillow>=10",
    "openai>=2.0",
    "typesafe-sdk>=0.7",
    "google-genai>=1.0",
    "pdf2image>=1.17",
    "img2pdf>=0.6",
    "opencv-python-headless>=4.10",
    "numpy>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "config*", "outbox*", "infrastructure*"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

# Third-party SDKs with no bundled type stubs / py.typed marker. Scoped to these
# modules only — strict mode stays on everywhere else.
[[tool.mypy.overrides]]
module = ["typesafe_sdk.*", "pdf2image.*", "img2pdf.*", "cv2.*", "browser_use.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-flask>=1.3.0",
    "pypdf>=5.0",
    "openapi-spec-validator>=0.7",
]

[tool.pytest.ini_options]
markers = [
    "requires_postgres: needs TEST_DATABASE_URL pointing at a real Postgres",
    "requires_browser: needs BROWSER_TESTS=1 and a real browser-use + Chrome + merchant login",
]
